plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.orbicrecorder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.orbicrecorder'
        minSdk 29
        targetSdk 32
        versionCode 21
        versionName '5.1-safe-recording-ota'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // For a future native APK release, configure a stable production signing key.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
