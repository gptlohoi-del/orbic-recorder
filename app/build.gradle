plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.orbicrecorder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.orbicrecorder'
        minSdk 29
        targetSdk 32
        versionCode 10
        versionName '4.0-voice-filter'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
