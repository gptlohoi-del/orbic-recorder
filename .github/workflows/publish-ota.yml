name: Publish Orbic Recorder OTA

on:
  workflow_dispatch:

# Prevent two manual OTA runs from trying to publish the same version.
concurrency:
  group: orbic-publish-ota-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Automatically version, sign, and package web update
        env:
          OTA_SIGNING_KEY_B64: ${{ secrets.OTA_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          python3 scripts/publish_ota.py

      - name: Commit published OTA to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ota/latest.json ota/bundles/
          VERSION="$(python3 -c 'import json; print(json.load(open("ota/latest.json", encoding="utf-8"))["version"])')"
          git commit -m "Publish signed web OTA ${VERSION}"
          git push origin HEAD:main
