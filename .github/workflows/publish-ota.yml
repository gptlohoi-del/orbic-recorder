name: Publish Orbic Recorder OTA

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New web OTA version (e.g. 1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Sign and package web update
        env:
          OTA_SIGNING_KEY_B64: ${{ secrets.OTA_SIGNING_KEY_B64 }}
          OTA_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/publish_ota.py --version "$OTA_VERSION"

      - name: Commit published OTA to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ota/latest.json ota/bundles/
          git commit -m "Publish signed web OTA ${{ inputs.version }}"
          git push origin HEAD:main
