name: Build Orbic Recorder v4.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CLEAN source tree (fail instead of building old UI)
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/orbicrecorder/MainActivity.java
          test -f app/src/main/java/com/example/orbicrecorder/RecorderService.java
          grep -Fq "version '8.7.3' apply false" build.gradle
          grep -Fq "versionName '4.0-voice-filter'" app/build.gradle
          grep -Fq 'ORBIC RECORDER v4.0' app/src/main/java/com/example/orbicrecorder/MainActivity.java
          test ! -f MainActivity.java
          test ! -f RecorderService.java
          test ! -f build.yml
          test "$(find . -name MainActivity.java | wc -l)" -eq 1
          test "$(find . -name RecorderService.java | wc -l)" -eq 1
          echo "Verified: unique v4.0 Java source & Gradle plugin version"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbic-recorder-v4-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
