name: Tạo APK Orbic Recorder (không cần Release Key)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'ota/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Verify project
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/example/orbicrecorder/MainActivity.java
          test -f app/src/main/java/com/example/orbicrecorder/RecorderService.java
          test -f app/src/main/java/com/example/orbicrecorder/MusicPlayer.java
          test -f app/src/main/java/com/example/orbicrecorder/OtaManager.java
          test -f app/src/main/java/com/example/orbicrecorder/AudioDynamics.java
          test -f app/src/main/assets/ui/app.js
          grep -q 'NATIVE_API = 12' app/src/main/java/com/example/orbicrecorder/OtaManager.java
          node --check app/src/main/assets/ui/app.js
          python3 -m py_compile scripts/publish_ota.py
          python3 tests/test_project.py
          python3 tests/test_v94_features.py
          python3 tests/test_rotation_180.py
          python3 tests/test_screen_orientation.py
          python3 tests/test_continuous_safety.py
          python3 tests/test_recording_library.py
          python3 tests/test_user_preferences.py
          python3 tests/test_auto_ota.py
          python3 tests/test_auto_start_and_notice.py
          python3 tests/test_manual_start_binding.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Java audio algorithms and permission callback
        run: |
          python3 tests/test_permission_callback.py
          python3 tests/test_silence_compactor.py
      - name: Check Android 9 compatibility of source
        run: python3 tests/test_android9_compat.py
      - name: Test limiter processing (pure Java)
        run: python3 tests/test_audio_dynamics.py
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK debug (auto signed)
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK installs on Android 9 (minSdk 28)
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -F "sdkVersion:'28'"
          echo "$BADGING" | grep -F "package: name='com.example.orbicrecorder'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Export APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ORBIC-RECORDER-v9.5.6-debug.apk
      - name: Upload APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ORBIC-RECORDER-v9.5.6-debug
          path: dist/ORBIC-RECORDER-v9.5.6-debug.apk
          retention-days: 30
          if-no-files-found: error
